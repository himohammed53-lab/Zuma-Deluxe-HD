name: Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Get the code (with SDL2, Expat, Ogg, Vorbis)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: CMake 4 + Ninja (the game needs CMake 4)
        run: |
          python3 -m venv /opt/cmake4
          /opt/cmake4/bin/pip install "cmake>=4.0,<4.2" ninja
          /opt/cmake4/bin/cmake --version
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "cmake.dir=/opt/cmake4" >> android/local.properties

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          # SDL2's sample project ships its own wrapper jar; we don't use it
          validate-wrappers: false

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/ZumaHD.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZumaHD-APK
          path: out/ZumaHD.apk
