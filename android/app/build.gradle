plugins {
    id 'com.android.application'
}

android {
    namespace 'com.muhamed.zumahd'
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.muhamed.zumahd"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    buildTypes {
        debug {
            // Optimised native code even in the test build, for 60 FPS
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            // The game's own CMakeLists.txt (same one used on PC)
            path "../../CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            // SDL2's Java side, from the SDL2 submodule
            java.srcDirs += ['../../thirdparty/sdl2/android-project/app/src/main/java']
            // Game files (images, sounds, music, levels, fonts)
            assets.srcDirs = ['../../content']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
